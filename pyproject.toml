[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-chromap"
version = "0.1.0"
description = "Reproducible monthly 500 m air-quality mapping for the Netherlands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
pipeline = [
  "cdsapi>=0.7", "duckdb>=1.0", "geopandas>=0.14", "joblib>=1.3",
  "matplotlib>=3.8", "netCDF4>=1.6", "pyogrio>=0.7", "pyproj>=3.6",
  "rasterio>=1.3", "requests>=2.31", "scikit-learn>=1.4", "scipy>=1.12",
  "shapely>=2.0", "xarray>=2024.1",
  "xgboost>=2,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
